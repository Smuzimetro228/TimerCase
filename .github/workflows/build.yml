name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          unzip -o *.zip
          cd "$(dirname "$(find . -name pom.xml | head -1)")"
          mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: "**/target/*.jar"
